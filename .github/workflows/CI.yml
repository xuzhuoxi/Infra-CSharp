name: CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Run build
        run: dotnet build Infra-CSharp.sln --configuration Release
      - name: Run test with coverage
        # Category=RunOnlyThis 的用例依赖本机服务（如 TCP 9999 / HTTP 9000），CI 中跳过。
        run: |
          set -euo pipefail
          dotnet test Infra-Tests/Infra-Tests.csproj \
            --configuration Release \
            --no-build \
            --filter "Category!=RunOnlyThis" \
            --collect:"XPlat Code Coverage" \
            --results-directory "${GITHUB_WORKSPACE}/coverage" \
            --blame-hang-timeout 5m \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
          find "${GITHUB_WORKSPACE}/coverage" -name 'coverage.cobertura.xml' -exec cp {} "${GITHUB_WORKSPACE}/coverage.cobertura.xml" \;
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage.cobertura.xml

  upload-coverage:
    name: Upload coverage
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download coverage artifact
        uses: actions/download-artifact@v7
        with:
          name: coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.cobertura.xml
          fail_ci_if_error: false
